name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      # Os testes de integração só rodam se DATABASE_URL existir no ambiente; sem ela, pulam.
      - run: bun run test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # O build só precisa que as variáveis existam; nenhuma conexão acontece nele.
      - run: bun run build
        env:
          DATABASE_URL_APP: postgres://build:build@localhost:5432/build
          BETTER_AUTH_SECRET: segredo-so-para-o-build-do-ci-0000000000
          BETTER_AUTH_URL: http://localhost:3000
