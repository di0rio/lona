name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      # Os testes de integração só rodam se DATABASE_URL existir no ambiente; sem ela, pulam.
      - run: bun run test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: bun run build
